<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-image</title>
<style>
  :root {
    --bg: {{bg}};
    --fg: {{fg}};
    --accent: {{accent}};
    --font: {{font}};
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 72px 88px 64px 88px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 18px;
    height: 630px;
    background: var(--accent);
  }
  .glow {
    position: absolute;
    right: -160px;
    top: -200px;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.12;
    filter: blur(40px);
  }
  .wordmark {
    position: relative;
    font-size: 108px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
  }
  .wordmark .accent { color: var(--accent); }
  .tagline {
    position: relative;
    margin-top: 28px;
    font-size: 36px;
    font-weight: 500;
    line-height: 1.32;
    max-width: 1000px;
    opacity: 0.88;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .domain {
    position: relative;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .domain::before {
    content: "";
    display: block;
    width: 56px;
    height: 6px;
    border-radius: 3px;
    background: var(--accent);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="bar"></div>
    <div class="glow"></div>
    <div>
      <div class="wordmark">{{wordmark}}</div>
      <p class="tagline">{{tagline}}</p>
    </div>
    <div class="domain">{{domain}}</div>
  </div>
</body>
</html>
